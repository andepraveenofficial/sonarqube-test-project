# ============================================================================
# SonarQube Scanner Configuration File
# ============================================================================

# Unique key for your project in SonarQube
sonar.projectKey=sonarqube-test-project
sonar.projectName=SonarQube Test Project
sonar.projectVersion=1.0.0

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Files to exclude from analysis
sonar.exclusions=node_modules/**,coverage/**,package-lock.json

# If you run SonarQube locally or on a remote server, specify host & token:
# sonar.host.url=http://localhost:9000
# sonar.token=your_sonarqube_user_token_or_project_token
